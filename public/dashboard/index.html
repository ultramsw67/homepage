<script>
(function(){
var P=JSON.parse(document.getElementById('payload').textContent);
var K='sood-dash-pw';
function u8(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function norm(s){return String(s||'').replace(/\s+/g,'').toLowerCase();}
function show(html){
  try{document.open();document.write(html);document.close();return;}catch(e){}
  // document.write 가 막힌 브라우저 대비 — 전체 화면 틀에 띄운다
  var fr=document.createElement('iframe');fr.setAttribute('style','position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff');
  fr.srcdoc=html;document.body.innerHTML='';document.body.appendChild(fr);
}
async function open(pw){
  pw=norm(pw);
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var buf;
  try{buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.iv)},key,u8(P.ct));}catch(e){var w=new Error('wrong');w.wrong=true;throw w;}
  show(new TextDecoder().decode(buf));
}
var f=document.getElementById('f'),msg=document.getElementById('msg'),go=document.getElementById('go');
if(!window.crypto||!crypto.subtle||!window.TextEncoder){msg.textContent='이 브라우저에서는 열 수 없습니다 (https 주소로 여세요).';go.disabled=true;return;}
var saved=null;try{saved=localStorage.getItem(K);}catch(e){}
if(saved){msg.style.color='inherit';msg.textContent='여는 중…';open(saved).catch(function(){try{localStorage.removeItem(K);}catch(e){}msg.style.color='';msg.textContent='저장된 비밀번호가 맞지 않습니다. 다시 넣어 주세요.';});}
f.addEventListener('submit',function(ev){
  ev.preventDefault();var pw=document.getElementById('pw').value;if(!pw)return;
  var keep=document.getElementById('keep').checked;
  go.disabled=true;msg.style.color='inherit';msg.textContent='여는 중…';
  open(pw).then(function(){if(keep){try{localStorage.setItem(K,pw);}catch(e){}}})
  .catch(function(e){go.disabled=false;msg.style.color='';msg.textContent=e&&e.wrong?'비밀번호가 틀립니다.':'열다가 오류가 났습니다: '+(e&&(e.name+' '+e.message));});
});
})();
</script>
